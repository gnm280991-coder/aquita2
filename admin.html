<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Aquí tái</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Quill.js Editor de texto enriquecido -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <!-- Sortable.js para ordenamiento -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
            <div class="p-5 text-2xl font-bold tracking-wider border-b border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-box-open text-amber-400"></i> Aquí tái 📦
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#dashboard" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-amber-500 text-slate-900 font-semibold transition"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="#productos" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
                <a href="#config" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-400">
                Cloud: Cloudinary (<span class="text-amber-400">rlrxdhzq</span>)
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
                <h1 class="text-xl font-bold text-slate-800">Panel de Control General</h1>
                <div class="flex items-center gap-4">
                    <span id="auth-status" class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">Firebase Conectado</span>
                </div>
            </header>

            <div class="p-6 space-y-6">
                <!-- Sección de Inventario / Productos -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-cloud-arrow-up text-amber-500 mr-2"></i>Gestor de Productos y Multimedia (Cloudinary)</h2>
                    </div>
                    
                    <!-- Formulario de Ejemplo Integrado -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Título del Producto / Caja Surpresa</label>
                            <input type="text" id="prod-title" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Ej. Caja Misteriosa Amazon V6">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Imagen (Subida directa a Cloudinary)</label>
                            <input type="file" id="prod-image-file" class="w-full border rounded-lg px-3 py-1.5 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                        </div>
                    </div>

                    <!-- Editor Quill -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción detallada</label>
                        <div id="editor-container" style="height: 120px;" class="bg-white rounded-b-lg"></div>
                    </div>

                    <button onclick="subirProductoConCloudinary()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-5 py-2 rounded-lg text-sm transition shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> Guardar Producto
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs (Compat / Modular según configuración del proyecto) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Configuración oficial de Firebase para Aquí tái
        const firebaseConfig = {
            apiKey: "AIzaSyD...RlaLyO_vO68oGc", // Reemplaza si requieres la clave completa exacta por seguridad en local
            authDomain: "aquita-tienda.firebaseapp.com",
            projectId: "aquita-tienda",
            storageBucket: "aquita-tienda.appspot.com",
            messagingSenderId: "981582885638",
            appId: "1:981582885638:web:9b4f96775ca04d78dba487"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Inicializar Quill.js
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Escribe las características de la sorpresa aquí...'
        });

        // Configuración de Cloudinary
        const CLOUDINARY_CLOUD_NAME = "rlrxdhzq";
        const CLOUDINARY_UPLOAD_PRESET = "presetnuevo";

        async function subirProductoConCloudinary() {
            const title = document.getElementById('prod-title').value;
            const fileInput = document.getElementById('prod-image-file').files[0];
            const description = quill.root.innerHTML;

            if (!title || !fileInput) {
                alert("Por favor completa el título y selecciona una imagen.");
                return;
            }

            // Preparar FormData para Cloudinary unsigned upload
            const formData = new FormData();
            formData.append('file', fileInput);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                // Mostrar estado de carga (puedes adaptarlo a tu UI)
                console.log("Subiendo imagen a Cloudinary...");
                
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.secure_url) {
                    const imageUrl = data.secure_url;
                    console.log("Imagen subida con éxito:", imageUrl);

                    // Guardar registro en Firestore
                    await db.collection("productos").add({
                        title: title,
                        description: description,
                        imageUrl: imageUrl,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("¡Producto guardado en Firebase y multimedia sincronizada con Cloudinary!");
                    document.getElementById('prod-title').value = '';
                    document.getElementById('prod-image-file').value = '';
                    quill.setContents([]);
                } else {
                    throw new Error("Error al subir la imagen a Cloudinary.");
                }
            } catch (error) {
                console.error("Error en el proceso:", error);
                alert("Hubo un error al registrar el producto.");
            }
        }
    </script>
</body>
</html>
