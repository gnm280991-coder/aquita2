<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Aquí Tá</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Panel de Administración</h1>
        <p>Sube nuevos productos a tu tienda</p>
    </header>

    <main class="contenedor-admin">
        <form id="form-producto">
            <div class="grupo-input">
                <label for="nombre">Nombre del producto:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="grupo-input">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" rows="3" required></textarea>
            </div>

            <div class="grupo-input">
                <label for="precio">Precio ($):</label>
                <input type="number" step="0.01" id="precio" required>
            </div>

            <div class="grupo-input">
                <label for="imagen">Foto del producto:</label>
                <input type="file" id="imagen" accept="image/*" required>
            </div>

            <button type="submit" id="btn-guardar">Publicar Producto</button>
        </form>

        <p id="mensaje-estado"></p>
        <br>
        <a href="index.html" class="enlace-volver">← Ver el catálogo público</a>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
