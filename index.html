<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquí tái | Tienda Oficial</title>
  <style>
    :root {
      --bg-main: #f4f6f8;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --accent-color: #ff9d00;
      --radius: 14px;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top {
      max-width: 1200px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .brand span { background: var(--accent-color); color: #000; font-size: 11px; padding: 2px 6px; border-radius: 6px; }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }

    /* GRID DE PRODUCTOS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); }

    .product-img-wrap {
      width: 100%;
      height: 180px;
      background: #eee;
      position: relative;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .product-category { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .product-name { font-size: 14px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { font-size: 16px; font-weight: 800; color: var(--text-main); margin-top: auto; }
    
    .badge-stock {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
      font-weight: bold;
    }
    .in-stock { background: #d1fae5; color: #065f46; }
    .out-stock { background: #fee2e2; color: #991b1b; }

    /* MODAL DETALLE */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center; z-index: 300; padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--bg-card); border-radius: 20px;
      width: min(100%, 450px); max-height: 90vh; overflow: auto; padding: 20px;
    }
    .modal-close {
      border: 0; background: var(--bg-main); color: var(--text-main);
      border-radius: 50%; width: 30px; height: 30px; cursor: pointer; float: right; font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="top">
      <div class="brand">Aquí tái <span>TIENDA OFICIAL</span></div>
      <div style="font-size: 12px; color: var(--text-muted);">Cochabamba, Bolivia</div>
    </div>
  </header>

  <main class="container">
    <h2>Catálogo Disponible</h2>
    <div id="publicProductsGrid" class="products-grid">
      <p style="grid-column: 1/-1; text-align: center; padding: 40px;">⏳ Cargando productos...</p>
    </div>
  </main>

  <!-- MODAL DE DETALLE -->
  <div id="detailModal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalImgContainer" style="width:100%; height:220px; border-radius:10px; overflow:hidden; margin-bottom:12px; background:#0001;">
        <img id="modalImg" src="" style="width:100%; height:100%; object-fit:cover;" alt="">
      </div>
      <div id="modalCategory" style="font-size:11px; font-weight:bold; color:var(--text-muted); text-transform:uppercase;"></div>
      <h3 id="modalName" style="margin: 4px 0 10px; font-size: 18px;"></h3>
      <div id="modalPrice" style="font-size: 20px; font-weight: 800; color:var(--accent-color); margin-bottom: 12px;"></div>
      <div id="modalStockBadge" style="margin-bottom: 14px;"></div>
      <hr style="border:0; border-top:1px solid var(--border-color); margin:12px 0;">
      <div id="modalDesc" style="font-size: 13px; line-height: 1.5; color: var(--text-muted);"></div>
    </div>
  </div>

  <!-- FIREBASE SDK V10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAj_ZTJwiNL3cZIKU2L-RlaLyO_vO68oGc",
        authDomain: "aquita-tienda.firebaseapp.com",
        projectId: "aquita-tienda",
        storageBucket: "aquita-tienda.appspot.com",
        messagingSenderId: "981582885638",
        appId: "1:981582885638:web:9b4f96775ca04d78dba487"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let publicProducts = [];

    async function loadPublicCatalog() {
      const grid = document.getElementById("publicProductsGrid");
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        publicProducts = [];

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          // Solo incluimos productos que tengan active en true
          if (data.active === true) {
            publicProducts.push({ id: docSnap.id, ...data });
          }
        });

        if (publicProducts.length === 0) {
          grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No hay productos disponibles en este momento.</p>`;
          return;
        }

        grid.innerHTML = publicProducts.map(p => {
          // Extraer imagen principal de forma segura (compatible con array images o campo image)
          let imgUrl = 'https://via.placeholder.com/300?text=Aquí+tái';
          if (Array.isArray(p.images) && p.images.length > 0) imgUrl = p.images[0];
          else if (p.image) imgUrl = p.image;

          const stock = Number(p.stock || 0);
          const stockHtml = stock > 0 
            ? `<span class="badge-stock in-stock">Stock: ${stock}</span>` 
            : `<span class="badge-stock out-stock">Agotado</span>`;

          return `
            <div class="product-card" onclick="openProductModal('${p.id}')">
              <div class="product-img-wrap">
                <img class="product-img" src="${escapeHTML(imgUrl)}" alt="${escapeHTML(p.name)}" loading="lazy">
              </div>
              <div class="product-info">
                <span class="product-category">${escapeHTML(p.category || 'General')}</span>
                <span class="product-name">${escapeHTML(p.name)}</span>
                ${stockHtml}
                <div class="product-price">Bs ${Number(p.price || 0).toFixed(2)}</div>
              </div>
            </div>
          `;
        }).join("");

      } catch (error) {
        console.error(error);
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Error al cargar el catálogo.</p>`;
      }
    }

    window.openProductModal = function(id) {
      const p = publicProducts.find(x => x.id === id);
      if (!p) return;

      let imgUrl = 'https://via.placeholder.com/300?text=Aquí+tái';
      if (Array.isArray(p.images) && p.images.length > 0) imgUrl = p.images[0];
      else if (p.image) imgUrl = p.image;

      document.getElementById("modalImg").src = imgUrl;
      document.getElementById("modalCategory").textContent = p.category || 'General';
      document.getElementById("modalName").textContent = p.name || '';
      document.getElementById("modalPrice").textContent = `Bs ${Number(p.price || 0).toFixed(2)}`;
      
      const stock = Number(p.stock || 0);
      document.getElementById("modalStockBadge").innerHTML = stock > 0 
        ? `<span class="badge-stock in-stock">Unidades disponibles: ${stock}</span>` 
        : `<span class="badge-stock out-stock">Producto Agotado</span>`;

      // Quill guarda la descripción en formato HTML seguro
      document.getElementById("modalDesc").innerHTML = p.description || 'Sin descripción detallada.';

      document.getElementById("detailModal").classList.add("open");
    };

    window.closeModal = function() {
      document.getElementById("detailModal").classList.remove("open");
    };

    function escapeHTML(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadPublicCatalog();
  </script>
</body>
</html>
